<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Turn-Based Combat/RPG Final Project</title>
  <link rel="stylesheet" href="style.css">
  <title>DESOLATE</title>
</head>
<body>
<main>
<!-- Start -->
<div id="start-screen" class="screen active">
  <h1>D E S O L A T E</h1>
  <button id="start-btn">Start</button>
</div>
<!--Overworld-->
<div id="world-screen" class="screen">
  <div id="world">
    <img id="player" src="Sprites/Characters/player_side.png">
  </div>
  <!--mobile controls UNFINISHED, UNLINKED-->
      <div id="dpad">
      <button data-direction="up">▲</button>
      <div>
        <button data-direction="left">◀</button>
        <button data-direction="down">▼</button>
        <button data-direction="right">▶</button>
      </div>
    </div>
  <button id="test-battle-btn">Test battle</button>
</div>

<!---Battle screen-->
<div id="battle-screen" class="screen">
  <img id="TheEnemy" src="Sprites/Characters/EnemySpritesheet.png"> <!-- Placeholder for enemy (sorry pete)-->
  <p>Player HP <span id="player-hp">100</span></p>
  <div id="log"></div>
  <p>Enemy HP: <span id="enemy-hp">100</span></p>
  <button id="attack-btn">Attack</button>
</div>
</main>

<script src="js/character.js"></script>
<script src="js/ui.js"></script>
<script src="js/gameManager.js"></script>
<script src="js/main.js"></script>


</body>
</html>
